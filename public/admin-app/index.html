<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="DR Admin"/>
<meta name="theme-color" content="#09090B"/>
<link rel="apple-touch-icon" href="/pwa/icon-192.png"/>
<link rel="manifest" href="/admin-app/manifest.json"/>
<title>DownRange Admin</title>
<style>
:root{--gold:#C8922A;--bg:#09090B;--bg2:#0E0E10;--bg3:#161618;--card:#111113;--text:#F0EDE8;--muted:#666;--border:rgba(255,255,255,0.07);--red:#B84040;--green:#6adb8a;--blue:#60a5fa;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Mono',monospace;min-height:100vh;overflow-x:hidden;}
button,input,select,textarea{font-family:inherit;} button{cursor:pointer;} button:focus,input:focus{outline:none;}
::-webkit-scrollbar{width:3px} ::-webkit-scrollbar-thumb{background:var(--border)}
.mono{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.10em;text-transform:uppercase;}
.gold{color:var(--gold);} .muted{color:var(--muted);} .green{color:var(--green);} .red{color:var(--red);}
.card{background:var(--card);border:1px solid var(--border);padding:14px 16px;}
.btn{background:var(--gold);color:var(--bg);border:none;padding:8px 16px;font-family:inherit;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 14px;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;}
.btn-red{background:rgba(184,64,64,0.1);border:1px solid rgba(184,64,64,0.28);color:#e08080;padding:7px 14px;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;}
input,select,textarea{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 10px;width:100%;font-size:11px;}
.pill{display:inline-block;padding:2px 8px;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;}
.pill-ok{background:rgba(34,197,94,.1);color:#22c55e;border:1px solid rgba(34,197,94,.2);}
.pill-err{background:rgba(184,64,64,.1);color:#e08080;border:1px solid rgba(184,64,64,.2);}
.pill-warn{background:rgba(224,168,48,.1);color:#e0a830;border:1px solid rgba(224,168,48,.2);}
.pill-gold{background:rgba(200,146,42,.1);color:var(--gold);border:1px solid rgba(200,146,42,.2);}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ── LOGIN ── -->
<div id="loginScreen" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
  <div style="width:100%;max-width:340px;border:1px solid var(--border);padding:28px;background:var(--card);">
    <img src="/logo.png" style="height:32px;width:auto;margin-bottom:20px;display:block;" alt="DR"/>
    <div style="font-size:24px;font-weight:700;color:var(--gold);letter-spacing:0.06em;font-family:Bebas Neue,sans-serif;margin-bottom:18px;">ADMIN ACCESS</div>
    <input type="password" id="keyInput" placeholder="Admin key" style="margin-bottom:12px;" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="btn" style="width:100%" onclick="doLogin()">Enter →</button>
  </div>
</div>

<!-- ── APP ── -->
<div id="app" style="display:none;min-height:100vh;display:none;flex-direction:column;">

  <!-- Top bar -->
  <div style="background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;height:48px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;flex-shrink:0;">
    <div style="display:flex;align-items:center;gap:10px;">
      <img src="/logo.png" style="height:24px;width:auto;" alt="DR"/>
      <span id="tabLabel" class="mono muted" style="font-size:10px;"></span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <div id="healthDot" style="width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s ease-in-out infinite;" title="Connected"></div>
      <button class="btn-ghost" style="padding:5px 10px;font-size:9px;" onclick="doLogout()">Sign Out</button>
    </div>
  </div>

  <!-- Content -->
  <div id="content" style="flex:1;overflow-y:auto;padding:16px 16px 100px;"></div>

  <!-- Bottom nav -->
  <nav style="position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:100;">
    <button class="nav-btn" data-tab="dashboard"  onclick="showTab('dashboard')"  style="flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;">⬡<span style="font-size:8px;letter-spacing:0.06em;text-transform:uppercase;">Home</span></button>
    <button class="nav-btn" data-tab="orders"     onclick="showTab('orders')"     style="flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;">◎<span style="font-size:8px;letter-spacing:0.06em;text-transform:uppercase;">Orders</span></button>
    <button class="nav-btn" data-tab="products"   onclick="showTab('products')"   style="flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;">◈<span style="font-size:8px;letter-spacing:0.06em;text-transform:uppercase;">Products</span></button>
    <button class="nav-btn" data-tab="ops"        onclick="showTab('ops')"        style="flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;position:relative;">◎<span style="font-size:8px;letter-spacing:0.06em;text-transform:uppercase;">Ops</span><span id="errBadge" style="display:none;position:absolute;top:2px;right:12px;background:var(--red);color:#fff;border-radius:50%;width:14px;height:14px;font-size:8px;display:none;align-items:center;justify-content:center;font-weight:700;" class="errBadgeEl"></span></button>
    <button class="nav-btn" data-tab="settings"   onclick="showTab('settings')"   style="flex:1;background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;">◌<span style="font-size:8px;letter-spacing:0.06em;text-transform:uppercase;">More</span></button>
  </nav>
</div>

<div id="toast" style="display:none;position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:9999;padding:10px 20px;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;max-width:90vw;text-align:center;"></div>

<script>
const BASE = '';
let ADMIN_KEY = '';
let currentTab = 'dashboard';

// ── Auth ──
function doLogin(){
  const k = document.getElementById('keyInput').value.trim();
  if(!k) return;
  ADMIN_KEY = k;
  localStorage.setItem('dr_admin_key', k);
  document.getElementById('loginScreen').style.display = 'none';
  const app = document.getElementById('app');
  app.style.display = 'flex';
  app.style.flexDirection = 'column';
  showTab('dashboard');
  startAutoRefresh();
}
function doLogout(){
  ADMIN_KEY=''; localStorage.removeItem('dr_admin_key');
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
}
window.addEventListener('load',()=>{
  const k=localStorage.getItem('dr_admin_key');
  if(k){
    ADMIN_KEY=k; document.getElementById('keyInput').value=k;
    document.getElementById('loginScreen').style.display='none';
    const app=document.getElementById('app'); app.style.display='flex'; app.style.flexDirection='column';
    showTab('dashboard'); startAutoRefresh();
  }
});

// ── Nav ──
function showTab(tab){
  currentTab=tab;
  document.getElementById('tabLabel').textContent=tab.toUpperCase();
  document.querySelectorAll('.nav-btn').forEach(b=>{
    b.style.color = b.dataset.tab===tab ? 'var(--gold)' : 'var(--muted)';
  });
  const c = document.getElementById('content');
  c.innerHTML = '<div style="padding:20px 0;text-align:center;color:var(--muted);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;">Loading…</div>';
  if(tab==='dashboard') renderDashboard();
  else if(tab==='orders') renderOrders();
  else if(tab==='products') renderProducts();
  else if(tab==='ops') renderOps();
  else if(tab==='settings') renderSettings();
}

// ── API helpers ──
async function apiFetch(params){ const r=await fetch(`/api/admin?${new URLSearchParams(params)}`,{headers:{'x-admin-key':ADMIN_KEY},cache:'no-store'}); return r.json(); }
async function apiPost(body){ const r=await fetch('/api/admin',{method:'POST',headers:{'x-admin-key':ADMIN_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}); return r.json(); }
async function opsGet(path){ const sep=path.includes('?')?'&':'?'; const r=await fetch(`${path}${sep}key=${ADMIN_KEY}`,{cache:'no-store'}); return r.json(); }

function toast(msg,type='ok'){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  t.style.background=type==='ok'?'rgba(34,197,94,.15)':'rgba(184,64,64,.15)';
  t.style.color=type==='ok'?'#22c55e':'#e08080';
  t.style.border=`1px solid ${type==='ok'?'rgba(34,197,94,.3)':'rgba(184,64,64,.3)'}`;
  setTimeout(()=>t.style.display='none',3000);
}
function money(v){return '$'+parseFloat(v||0).toFixed(2);}
function fmtAge(ts){if(!ts)return'—';const m=Math.floor((Date.now()-new Date(ts).getTime())/60000);if(isNaN(m))return'—';if(m<1)return'now';if(m<60)return m+'m';if(m<1440)return Math.floor(m/60)+'h';return Math.floor(m/1440)+'d';}
function pill(text,cls='ok'){return`<span class="pill pill-${cls}">${text}</span>`;}
function statusPill(s){const ok=s==='active'||s==='paid'||s==='published'||s==='ACTIVE';return pill(s,ok?'ok':'err');}

// ── Dashboard ──
async function renderDashboard(){
  const c=document.getElementById('content');
  try{
    const [od,hd,ld]=await Promise.all([
      apiFetch({action:'list_orders',limit:'5'}),
      opsGet('/api/ops/health'),
      opsGet('/api/ops/alert?count=100'),
    ]);
    const orders=od.orders??[]; const checks=hd.checks??[]; const stats=ld.stats??{};
    const errCount=(ld.logs??[]).filter(l=>l.level==='error'||l.level==='critical').length;
    showErrBadge(errCount);

    c.innerHTML=`
    <div style="font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:0.04em;margin-bottom:16px;line-height:1;">
      COMMAND <span class="gold">CENTER</span>
    </div>

    <!-- Health -->
    <div style="margin-bottom:16px;">
      <div class="mono muted" style="margin-bottom:8px;">System Health · ${hd.status?.toUpperCase()??'UNKNOWN'}</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">
        ${checks.map(ch=>`
          <div class="card" style="border-color:${ch.status==='ok'?'rgba(34,197,94,.25)':ch.status==='error'?'rgba(184,64,64,.3)':'var(--border)'}">
            <div class="mono" style="font-size:8px;color:var(--muted);margin-bottom:3px;">${ch.name}</div>
            <div class="mono" style="color:${ch.status==='ok'?'var(--green)':ch.status==='error'?'#e08080':'#e0a830'}">${ch.status?.toUpperCase()}</div>
            ${ch.latency?`<div class="mono muted" style="font-size:8px;margin-top:2px;">${ch.latency}ms</div>`:''}
          </div>`).join('')}
      </div>
    </div>

    <!-- Stats -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px;">
      ${[['Orders',orders.length,'var(--gold)'],['Errors',errCount,errCount>0?'#e08080':'var(--muted)'],['SMS',stats.smsAttempts??0,'var(--green)']].map(([l,v,col])=>`
        <div class="card">
          <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:${col};line-height:1;">${v}</div>
          <div class="mono muted" style="font-size:8px;margin-top:2px;">${l}</div>
        </div>`).join('')}
    </div>

    <!-- Recent orders -->
    <div class="mono muted" style="margin-bottom:8px;">Recent Orders</div>
    <div style="border:1px solid var(--border);">
      ${orders.length===0?'<div class="mono muted" style="padding:20px;text-align:center;">No orders yet</div>':
        orders.map(o=>`
        <div style="padding:10px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;" onclick="renderOrderDetail(${JSON.stringify(o).replace(/'/g,'&#39;')})">
          <div>
            <div class="mono" style="font-size:10px;">#${o.order_number} · ${money(o.total_price)}</div>
            <div class="mono muted" style="font-size:8px;margin-top:2px;">${o.customer?.first_name??''} ${o.customer?.last_name??''} · ${fmtAge(o.created_at)}</div>
          </div>
          ${statusPill(o.financial_status??'pending')}
        </div>`).join('')
      }
    </div>
    <div style="margin-top:10px;display:flex;gap:8px;">
      <button class="btn" onclick="showTab('orders')">All Orders →</button>
      <button class="btn-ghost" onclick="renderDashboard()">↻ Refresh</button>
    </div>`;
  }catch(e){c.innerHTML=`<div class="mono" style="color:#e08080;padding:20px;">Error loading dashboard: ${e.message}</div>`;}
}

// ── Orders ──
async function renderOrders(filter='any'){
  const c=document.getElementById('content');
  c.innerHTML='<div class="mono muted" style="padding:20px;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:0.1em;">Loading orders…</div>';
  try{
    const d=await apiFetch({action:'list_orders',limit:'50',status:filter});
    const orders=d.orders??[];
    c.innerHTML=`
    <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.04em;margin-bottom:14px;">ORDERS <span class="gold">(${orders.length})</span></div>
    <div style="display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;">
      ${['any','open','closed','cancelled'].map(f=>`<button onclick="renderOrders('${f}')" style="padding:5px 12px;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;background:${f===filter?'rgba(200,146,42,.1)':'transparent'};border:1px solid ${f===filter?'rgba(200,146,42,.28)':'var(--border)'};color:${f===filter?'var(--gold)':'var(--muted)'};">${f}</button>`).join('')}
    </div>
    <div style="border:1px solid var(--border);">
      ${orders.length===0?'<div class="mono muted" style="padding:20px;text-align:center;">No orders</div>':
        orders.map(o=>`
        <div style="padding:11px 12px;border-bottom:1px solid var(--border);" onclick="renderOrderDetail(${JSON.stringify(o).replace(/"/g,'&quot;')})">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
            <span class="mono gold">#${o.order_number}</span>
            <span class="mono" style="color:var(--green);font-size:11px;">${money(o.total_price)}</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="mono muted" style="font-size:9px;">${o.customer?.first_name??''} ${o.customer?.last_name??''} · ${fmtAge(o.created_at)}</span>
            ${statusPill(o.financial_status??'pending')}
          </div>
        </div>`).join('')
      }
    </div>`;
  }catch(e){c.innerHTML=`<div class="mono" style="color:#e08080;padding:20px;">Error: ${e.message}</div>`;}
}

function renderOrderDetail(o){
  const c=document.getElementById('content');
  c.innerHTML=`
  <div style="display:flex;gap:10px;align-items:center;margin-bottom:16px;">
    <button class="btn-ghost" style="padding:5px 10px;font-size:9px;" onclick="renderOrders()">← Back</button>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:0.04em;">ORDER #${o.order_number}</div>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:14px;">${statusPill(o.financial_status)} ${statusPill(o.fulfillment_status??'unfulfilled')}</div>
  <div class="card" style="margin-bottom:12px;">
    <div class="mono gold" style="margin-bottom:10px;">Line Items</div>
    ${(o.line_items??[]).map(li=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);"><div><div class="mono" style="font-size:10px;">${li.name}</div><div class="mono muted" style="font-size:8px;">Qty: ${li.quantity}</div></div><span class="mono gold">${money(li.price)}</span></div>`).join('')}
    <div style="display:flex;justify-content:space-between;padding-top:10px;"><span class="mono">Total</span><span class="mono" style="color:var(--green);">${money(o.total_price)}</span></div>
  </div>
  <div class="card" style="margin-bottom:12px;">
    <div class="mono gold" style="margin-bottom:8px;">Customer</div>
    <div class="mono" style="font-size:10px;">${o.customer?.first_name??''} ${o.customer?.last_name??''}</div>
    <div class="mono muted" style="font-size:9px;margin-top:4px;">${o.customer?.email??''}</div>
  </div>
  ${o.shipping_address?`<div class="card"><div class="mono gold" style="margin-bottom:8px;">Shipping</div><div class="mono" style="font-size:10px;">${o.shipping_address.address1}</div><div class="mono muted" style="font-size:9px;margin-top:3px;">${o.shipping_address.city}, ${o.shipping_address.province_code} ${o.shipping_address.zip}</div></div>`:''}`;
}

// ── Products ──
async function renderProducts(){
  const c=document.getElementById('content');
  c.innerHTML='<div class="mono muted" style="padding:20px;text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:0.1em;">Loading products…</div>';
  try{
    const d=await apiFetch({action:'list_products',limit:'250'});
    const products=d.products??[];
    c.innerHTML=`
    <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.04em;margin-bottom:14px;">PRODUCTS <span class="gold">(${products.length})</span></div>
    <input placeholder="Search…" id="prodSearch" oninput="filterProducts()" style="margin-bottom:12px;"/>
    <div id="prodList" style="border:1px solid var(--border);">
      ${renderProductList(products)}
    </div>`;
    window._allProducts = products;
  }catch(e){c.innerHTML=`<div class="mono" style="color:#e08080;padding:20px;">Error: ${e.message}</div>`;}
}
function renderProductList(products){
  if(products.length===0) return '<div class="mono muted" style="padding:20px;text-align:center;">No products</div>';
  return products.map(p=>`
    <div style="display:grid;grid-template-columns:44px 1fr auto;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);align-items:center;">
      <div style="width:44px;height:44px;background:var(--bg3);overflow:hidden;">${p.images?.[0]?.src?`<img src="${p.images[0].src}" style="width:100%;height:100%;object-fit:cover;">`:''}</div>
      <div>
        <div class="mono" style="font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.title}</div>
        <div class="mono gold" style="font-size:9px;margin-top:2px;">${money(p.variants?.[0]?.price??0)}</div>
      </div>
      ${statusPill(p.status)}
    </div>`).join('');
}
function filterProducts(){
  const q=document.getElementById('prodSearch')?.value?.toLowerCase()||'';
  const filtered=(window._allProducts||[]).filter(p=>p.title?.toLowerCase().includes(q));
  const list=document.getElementById('prodList');
  if(list) list.innerHTML=renderProductList(filtered);
}

// ── Operations ──
async function renderOps(subTab='health'){
  const c=document.getElementById('content');
  try{
    const [hd,ld]=await Promise.all([
      opsGet('/api/ops/health'),
      opsGet('/api/ops/alert?count=200'),
    ]);
    const logs=ld.logs??[]; const stats=ld.stats??{};
    const errCount=logs.filter(l=>l.level==='error'||l.level==='critical').length;
    const smsLogs=logs.filter(l=>l.job==='sms'||l.job==='sms-test');
    const sentSms=smsLogs.filter(l=>l.level==='ok');
    showErrBadge(errCount);

    const tabs=[['health','Health'],['logs','Logs'],['sms','SMS'],['webhooks','Webhooks'],['crons','Crons']];

    c.innerHTML=`
    <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.04em;margin-bottom:12px;">OPS <span class="gold">CENTER</span></div>

    <!-- Stats -->
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:14px;">
      ${[['Events',logs.length,'var(--text)'],['Errors',errCount,errCount>0?'#e08080':'var(--muted)'],['SMS',sentSms.length,'var(--green)'],['Warns',stats.warnings??0,stats.warnings>0?'#e0a830':'var(--muted)']].map(([l,v,col])=>`<div class="card"><div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:${col};line-height:1;">${v}</div><div class="mono muted" style="font-size:7px;margin-top:2px;">${l}</div></div>`).join('')}
    </div>

    <!-- Sub-tabs -->
    <div style="display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto;">
      ${tabs.map(([id,label])=>`<button onclick="renderOps('${id}')" style="padding:8px 14px;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;background:transparent;border:none;border-bottom:2px solid ${subTab===id?'var(--gold)':'transparent'};color:${subTab===id?'var(--gold)':'var(--muted)'};white-space:nowrap;">${label}</button>`).join('')}
    </div>

    <div id="opsSubContent"></div>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn-ghost" style="font-size:9px;" onclick="renderOps('${subTab}')">↻ Refresh</button>
      <button class="btn" style="font-size:9px;" onclick="forceSync()">⟳ Sync</button>
      <button class="btn-ghost" style="font-size:9px;" onclick="testSMS()">📱 Test SMS</button>
      <button class="btn-red" style="font-size:9px;" onclick="clearLog()">✕ Clear Log</button>
    </div>`;

    const sub=document.getElementById('opsSubContent');
    if(subTab==='health'){
      sub.innerHTML=`<div style="display:flex;flex-direction:column;gap:8px;">
        ${(hd.checks??[]).map(ch=>`<div class="card" style="border-color:${ch.status==='ok'?'rgba(34,197,94,.25)':ch.status==='error'?'rgba(184,64,64,.3)':'var(--border)'}">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span class="mono muted" style="font-size:9px;">${ch.name}</span>
            <span class="mono" style="font-size:10px;color:${ch.status==='ok'?'var(--green)':ch.status==='error'?'#e08080':'#e0a830'}">${ch.status?.toUpperCase()}</span>
          </div>
          ${ch.latency?`<div class="mono muted" style="font-size:8px;margin-top:4px;">${ch.latency}ms${ch.detail?' · '+ch.detail:''}</div>`:''}
        </div>`).join('')}
      </div>`;
    } else if(subTab==='logs'){
      const recent=logs.slice(0,50);
      const lc=(l)=>({ok:'var(--green)',info:'#8888dd',warn:'#e0a830',error:'#e08080',critical:'#ff5555'}[l]||'var(--muted)');
      const li=(l)=>({ok:'✓',info:'·',warn:'△',error:'✗',critical:'!'}[l]||'·');
      sub.innerHTML=`<div style="border:1px solid var(--border);">${recent.map(l=>`
        <div style="padding:7px 10px;border-bottom:1px solid var(--border);background:${l.level==='error'||l.level==='critical'?'rgba(184,64,64,0.06)':l.level==='warn'?'rgba(180,120,20,0.04)':'transparent'}">
          <div style="display:flex;gap:8px;align-items:center;">
            <span style="color:${lc(l.level)};font-size:11px;">${li(l.level)}</span>
            <span class="mono gold" style="font-size:8px;">${l.job}</span>
            <span class="mono muted" style="font-size:7px;margin-left:auto;">${fmtAge(l.ts)}</span>
          </div>
          <div class="mono" style="font-size:9px;margin-top:3px;color:var(--text);">${l.message}</div>
          ${l.detail?`<div class="mono muted" style="font-size:8px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${l.detail}</div>`:''}
        </div>`).join('')}
      </div>`;
    } else if(subTab==='sms'){
      const lc=(l)=>l.level==='ok'?'#22c55e':(l.detail||'').includes('configured')?'var(--blue)':'#ef4444';
      const lt=(l)=>l.level==='ok'?'SENT':(l.detail||'').includes('configured')?'SKIP':'FAIL';
      sub.innerHTML=`
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:12px;">
          <div class="card"><div style="font-size:20px;font-family:'Bebas Neue',sans-serif;color:var(--green)">${sentSms.length}</div><div class="mono muted" style="font-size:7px">SENT</div></div>
          <div class="card"><div style="font-size:20px;font-family:'Bebas Neue',sans-serif;color:#e08080">${smsLogs.filter(l=>l.level!=='ok'&&!(l.detail||'').includes('configured')).length}</div><div class="mono muted" style="font-size:7px">FAILED</div></div>
          <div class="card"><div style="font-size:20px;font-family:'Bebas Neue',sans-serif;color:var(--muted)">${smsLogs.filter(l=>(l.detail||'').includes('configured')).length}</div><div class="mono muted" style="font-size:7px">SKIPPED</div></div>
        </div>
        <div style="border:1px solid var(--border);">${smsLogs.slice(0,30).map(l=>`
          <div style="padding:8px 10px;border-bottom:1px solid var(--border);">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">
              <span class="pill" style="background:${lc(l)}14;color:${lc(l)};border:1px solid ${lc(l)}28;">${lt(l)}</span>
              <span class="mono muted" style="font-size:7px;">${fmtAge(l.ts)}</span>
            </div>
            <div class="mono" style="font-size:9px;">${l.message}</div>
          </div>`).join('')}
        </div>`;
    } else if(subTab==='webhooks'){
      let wh=[];
      try{ const wr=await fetch('/api/webhooks/register',{headers:{'x-admin-key':ADMIN_KEY}}); const wd=await wr.json(); wh=wd.webhooks??[]; }catch{}
      sub.innerHTML=`
        <button class="btn" style="margin-bottom:12px;font-size:9px;" onclick="registerWebhooks()">⚡ Register All Webhooks</button>
        <div id="whResult" style="margin-bottom:12px;"></div>
        <div style="border:1px solid var(--border);">
          ${wh.length===0?'<div class="mono muted" style="padding:16px;text-align:center;">No webhooks registered</div>':
            wh.map(w=>`<div style="padding:10px 12px;border-bottom:1px solid var(--border);"><div class="mono gold" style="font-size:9px;">${w.topic}</div><div class="mono muted" style="font-size:8px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${w.address}</div></div>`).join('')}
        </div>`;
    } else if(subTab==='crons'){
      sub.innerHTML=`<div style="display:flex;flex-direction:column;gap:8px;">
        ${[['product-sync','Hourly','/api/ops/sync-products','ISR cache refresh'],['health-check','Every 15min','/api/ops/health?alert=1','All APIs check'],['daily-backup','6am UTC','/api/ops/backup','Redis → GitHub']].map(([job,sched,path,desc])=>`
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
          <div>
            <div class="mono gold" style="font-size:9px;margin-bottom:3px;">${job}</div>
            <div class="mono muted" style="font-size:8px;">${sched} · ${desc}</div>
          </div>
          <button class="btn" style="font-size:8px;white-space:nowrap;" onclick="runCron('${path}','${job}')">▶ Run</button>
        </div>`).join('')}
      </div>`;
    }
  }catch(e){document.getElementById('content').innerHTML=`<div class="mono" style="color:#e08080;padding:20px;">Error: ${e.message}</div>`;}
}

// ── Settings / More ──
function renderSettings(){
  const c=document.getElementById('content');
  c.innerHTML=`
  <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:0.04em;margin-bottom:18px;">MORE <span class="gold">OPTIONS</span></div>
  <div style="display:flex;flex-direction:column;gap:8px;">
    ${[
      ['↗ Visit Store',()=>window.open('/','_blank')],
      ['🖼 Manage Hero Slides',()=>window.open('/admin','_blank')],
      ['📄 Edit Pages',()=>window.open('/admin','_blank')],
      ['↗ Shopify Admin',()=>window.open('https://downrange-co.myshopify.com/admin','_blank')],
      ['↗ Vercel Dashboard',()=>window.open('https://vercel.com','_blank')],
      ['↗ News Portal',()=>window.open('https://downrangeco.com','_blank')],
    ].map(([l,fn],i)=>`<button class="btn-ghost" style="text-align:left;padding:12px 14px;font-size:10px;" onclick="(${fn.toString()})()">${l}</button>`).join('')}
  </div>
  <div style="margin-top:20px;padding:14px;background:var(--bg3);border:1px solid var(--border);">
    <div class="mono muted" style="font-size:8px;margin-bottom:8px;">Admin Key</div>
    <div class="mono" style="font-size:9px;color:var(--gold);">${ADMIN_KEY.slice(0,4)}${'•'.repeat(Math.max(0,ADMIN_KEY.length-4))}</div>
  </div>
  <button class="btn-red" style="margin-top:12px;width:100%;" onclick="doLogout()">Sign Out</button>`;
}

// ── Action helpers ──
async function forceSync(){
  toast('Syncing products…','ok');
  try{ await fetch('/api/ops/sync-products',{headers:{'x-admin-key':ADMIN_KEY}}); toast('Sync complete ✓','ok'); }
  catch(e){ toast('Sync failed: '+e.message,'err'); }
}
async function testSMS(){
  toast('Sending test SMS…','ok');
  try{
    const r=await fetch('/api/ops/test-sms',{method:'POST',headers:{'x-admin-key':ADMIN_KEY,'Content-Type':'application/json'},body:'{}'});
    const d=await r.json(); toast(d.sent?'SMS sent ✓':'SMS failed: '+(d.errorMessage||'unknown'),'ok');
  }catch(e){ toast('Error: '+e.message,'err'); }
}
async function clearLog(){
  if(!confirm('Clear all ops logs?')) return;
  try{
    await fetch('/api/ops/alert?key='+ADMIN_KEY,{method:'DELETE',headers:{'x-admin-key':ADMIN_KEY}});
    toast('Log cleared','ok'); renderOps();
  }catch(e){ toast('Error: '+e.message,'err'); }
}
async function runCron(path,job){
  toast('Running '+job+'…','ok');
  try{
    const r=await fetch(path,{headers:{'x-admin-key':ADMIN_KEY}});
    const d=await r.json(); toast(r.ok?job+' complete ✓':'Error: '+(d.error||'failed'),r.ok?'ok':'err');
  }catch(e){ toast('Error: '+e.message,'err'); }
}
async function registerWebhooks(){
  const el=document.getElementById('whResult');
  if(el) el.innerHTML='<div class="mono muted" style="font-size:9px;">Registering…</div>';
  try{
    const r=await fetch('/api/webhooks/register',{method:'POST',headers:{'x-admin-key':ADMIN_KEY}});
    const d=await r.json();
    if(el) el.innerHTML=d.ok?'<div class="mono" style="color:var(--green);font-size:9px;">✓ Webhooks registered</div>':'<div class="mono" style="color:#e08080;font-size:9px;">✗ '+( d.error||'failed')+'</div>';
    setTimeout(()=>renderOps('webhooks'),500);
  }catch(e){ if(el) el.innerHTML=`<div class="mono" style="color:#e08080;font-size:9px;">✗ ${e.message}</div>`; }
}

// ── Error badge ──
function showErrBadge(n){
  const badges=document.querySelectorAll('.errBadgeEl');
  badges.forEach(b=>{b.style.display=n>0?'flex':'none';b.textContent=n;});
}

// ── Auto-refresh ──
let refreshTimer=null;
function startAutoRefresh(){
  clearInterval(refreshTimer);
  refreshTimer=setInterval(()=>{
    if(currentTab==='dashboard') renderDashboard();
    else if(currentTab==='ops') renderOps();
  },30000);
}
</script>
