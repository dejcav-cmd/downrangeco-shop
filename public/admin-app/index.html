<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#09090B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="DR Shop">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="../pwa/icon-192.png">
<title>DR Shop Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090B;--bg2:#111113;--bg3:#1A1A1D;--bg4:#21252f;
  --border:rgba(255,255,255,0.06);--border2:#2d3748;
  --text:#F0EDE8;--dim:#777;--dim2:#4b5563;
  --gold:#C8922A;--ok:#22c55e;--err:#ef4444;--warn:#f59e0b;--blue:#3b82f6;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
  --topbar-h:52px;--nav-h:60px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Barlow Condensed',sans-serif;overscroll-behavior:none;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;text-decoration:none;}

/* TOPBAR */
#topbar{position:fixed;top:0;left:0;right:0;z-index:200;height:calc(var(--topbar-h) + var(--safe-t));padding-top:var(--safe-t);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding-left:calc(16px + var(--safe-l));padding-right:calc(16px + var(--safe-r));gap:10px;}
#topbar-logo{font-family:'Bebas Neue',cursive;font-size:1.3rem;color:var(--gold);letter-spacing:.1em;flex-shrink:0;}
#topbar-sub{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;}
#topbar-title{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#topbar-status{font-size:10px;color:var(--ok);flex-shrink:0;font-family:'IBM Plex Mono',monospace;}

/* FLASH */
#flash{position:fixed;top:calc(var(--topbar-h) + var(--safe-t));left:0;right:0;z-index:199;padding:10px 16px;font-family:'IBM Plex Mono',monospace;font-size:11px;display:none;align-items:center;gap:8px;}
#flash.show{display:flex;}
#flash.ok{background:rgba(34,197,94,.12);border-bottom:1px solid rgba(34,197,94,.3);color:#4ade80;}
#flash.err{background:rgba(239,68,68,.14);border-bottom:1px solid rgba(239,68,68,.3);color:#f87171;}
#flash.info{background:rgba(200,146,42,.1);border-bottom:1px solid rgba(200,146,42,.3);color:var(--gold);}
#flash-close{margin-left:auto;background:none;border:none;color:inherit;font-size:16px;}

/* BOTTOM NAV */
#bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:200;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--bg2);border-top:1px solid var(--border);display:flex;}
.nav-tab{flex:1;background:none;border:none;border-top:2px solid transparent;color:var(--dim2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;}
.nav-tab.active{color:var(--gold);border-top-color:var(--gold);}
.nav-tab-icon{font-size:18px;line-height:1;}
.nav-tab-label{font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;}

/* APP SHELL */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding-top:calc(var(--topbar-h) + var(--safe-t));padding-bottom:calc(var(--nav-h) + var(--safe-b));}
#content{flex:1;overflow:hidden;position:relative;}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:16px;display:none;-webkit-overflow-scrolling:touch;}
.screen.active{display:block;animation:fadeIn .15s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* DRAWER */
#drawer{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);background:var(--bg);pointer-events:none;}
#drawer.open{transform:translateX(0);pointer-events:all;}
#drawer-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + var(--safe-t));background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;}
#drawer-back{background:none;border:none;color:var(--gold);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 8px;margin-left:-8px;}
#drawer-title{font-family:'Bebas Neue',cursive;font-size:1.3rem;color:var(--text);letter-spacing:.08em;flex:1;}
#drawer-content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;padding-bottom:calc(16px + var(--safe-b));}

/* COMPONENTS */
.section-title{font-family:'Bebas Neue',cursive;font-size:1.6rem;color:var(--text);letter-spacing:.06em;margin-bottom:2px;}
.section-sub{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:16px;}
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
.panel-btn{background:var(--bg2);border:1px solid var(--border);padding:14px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;transition:border-color .15s;position:relative;}
.panel-btn:active{border-color:var(--gold);}
.panel-icon{font-size:22px;line-height:1;}
.panel-label{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:.04em;}
.panel-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);line-height:1.4;}
.panel-badge{position:absolute;top:8px;right:8px;font-family:'IBM Plex Mono',monospace;font-size:7px;font-weight:700;padding:2px 5px;background:rgba(200,146,42,.2);color:var(--gold);border:1px solid rgba(200,146,42,.3);letter-spacing:.06em;text-transform:uppercase;}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;}
.stat-box{background:var(--bg2);border:1px solid var(--border);padding:10px 8px;}
.stat-val{font-family:'Bebas Neue',cursive;font-size:1.8rem;line-height:1;color:var(--gold);}
.stat-lbl{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-top:3px;}
.btn{width:100%;background:var(--gold);color:#000;border:none;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;padding:11px;cursor:pointer;text-transform:uppercase;}
.btn:active{opacity:.8;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn-outline{background:none;border:1px solid var(--border);color:var(--dim);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:8px 14px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.btn-outline:active{border-color:var(--gold);color:var(--gold);}
.btn-danger{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--err);font-family:'IBM Plex Mono',monospace;font-size:10px;padding:8px 14px;cursor:pointer;}
.log-entry{background:var(--bg2);border:1px solid var(--border);margin-bottom:6px;padding:10px 12px;}
.log-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.log-detail{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-top:4px;word-break:break-all;}
.log-err{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--err);margin-top:4px;}
.pill{font-family:'IBM Plex Mono',monospace;font-size:9px;font-weight:700;padding:2px 7px;letter-spacing:.05em;display:inline-block;}
.pill-ok{background:rgba(34,197,94,.12);color:var(--ok);border:1px solid rgba(34,197,94,.2);}
.pill-warn{background:rgba(245,158,11,.12);color:var(--warn);border:1px solid rgba(245,158,11,.2);}
.pill-err{background:rgba(239,68,68,.12);color:var(--err);border:1px solid rgba(239,68,68,.2);}
.loading{display:flex;align-items:center;gap:10px;padding:40px;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);}
.spinner{animation:spin 1.2s linear infinite;display:inline-block;}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.empty{padding:40px;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim2);}
.mono{font-family:'IBM Plex Mono',monospace;}

/* LOGIN */
#login{position:fixed;inset:0;z-index:500;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;}
#login-box{width:100%;max-width:340px;}
#login-logo{font-family:'Bebas Neue',cursive;font-size:2.2rem;color:var(--gold);letter-spacing:.1em;margin-bottom:4px;}
#login-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-bottom:28px;}
#login-input{width:100%;background:var(--bg2);border:1px solid var(--border2);color:var(--text);padding:13px 14px;font-family:'IBM Plex Mono',monospace;font-size:14px;outline:none;margin-bottom:10px;}
#login-input:focus{border-color:var(--gold);}
@keyframes drPulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login">
  <div id="login-box">
    <div id="login-logo">DOWN RANGE CO.</div>
    <div id="login-sub">Shop Admin · drco-admin-2026</div>
    <input id="login-input" type="password" placeholder="Admin key…" autocomplete="current-password">
    <button class="btn" onclick="doLogin()">ENTER ADMIN</button>
  </div>
</div>

<!-- FLASH -->
<div id="flash"><span id="flash-msg"></span><button id="flash-close" onclick="hideFlash()">×</button></div>

<!-- TOPBAR -->
<div id="topbar">
  <div>
    <div id="topbar-logo">DR SHOP</div>
    <div id="topbar-sub">Store Admin</div>
  </div>
  <div id="topbar-title"></div>
  <div id="topbar-status">●</div>
</div>

<!-- DRAWER -->
<div id="drawer">
  <div id="drawer-bar">
    <button id="drawer-back" onclick="closeDrawer()">← Back</button>
    <div id="drawer-title">Panel</div>
  </div>
  <div id="drawer-content"></div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div id="content">
    <div id="screen-dashboard" class="screen active"></div>
    <div id="screen-ops"       class="screen"></div>
    <div id="screen-orders"    class="screen"></div>
    <div id="screen-settings"  class="screen"></div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div id="bottom-nav">
  <button class="nav-tab active" onclick="showScreen('dashboard',this)">
    <span class="nav-tab-icon">⬡</span><span class="nav-tab-label">Dashboard</span>
  </button>
  <button class="nav-tab" onclick="showScreen('ops',this)">
    <span class="nav-tab-icon">◎</span><span class="nav-tab-label">Operations</span>
  </button>
  <button class="nav-tab" onclick="showScreen('orders',this)">
    <span class="nav-tab-icon">◈</span><span class="nav-tab-label">Orders</span>
  </button>
  <button class="nav-tab" onclick="showScreen('settings',this)">
    <span class="nav-tab-icon">⚙</span><span class="nav-tab-label">Settings</span>
  </button>
</div>

<script>
// ─── AUTH ─────────────────────────────────────────────────────────────────────
let _key='';
const PANELS={};

function doLogin(){
  const v=document.getElementById('login-input').value.trim();
  if(!v){flash('Enter admin key','err');return;}
  _key=v;
  localStorage.setItem('drshop_admin_key',v);
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='flex';
  initApp();
}
window.addEventListener('load',()=>{
  if('serviceWorker' in navigator) navigator.serviceWorker.register('/admin-app/sw.js').catch(()=>{});
  const saved=localStorage.getItem('drshop_admin_key');
  if(saved){_key=saved;document.getElementById('login').style.display='none';document.getElementById('app').style.display='flex';initApp();}
  else{document.getElementById('login-input').focus();}
  document.getElementById('login-input').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
});

// ─── UTILS ────────────────────────────────────────────────────────────────────
function H(){return{'x-admin-key':_key,'Content-Type':'application/json'};}
async function api(path){
  const r=await fetch(path,{headers:{'x-admin-key':_key},cache:'no-store'});
  if(r.status===401){logout();throw new Error('Unauthorized');}
  return r.json();
}
async function apiPost(path,body){
  const r=await fetch(path,{method:'POST',headers:H(),body:JSON.stringify(body)});
  if(r.status===401){logout();throw new Error('Unauthorized');}
  return r.json();
}
function logout(){_key='';localStorage.removeItem('drshop_admin_key');location.reload();}
function flash(msg,type='ok',dur=3500){
  const el=document.getElementById('flash');
  document.getElementById('flash-msg').textContent=msg;
  el.className='show '+type;
  setTimeout(hideFlash,dur);
}
function hideFlash(){document.getElementById('flash').className='';}
function fmtAge(ts){
  const m=Math.floor((Date.now()-new Date(ts).getTime())/60000);
  if(m<1) return 'just now';if(m<60) return m+'m ago';
  if(m<1440) return Math.floor(m/60)+'h ago';return Math.floor(m/1440)+'d ago';
}
function fmtTime(ts){return new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}

// ─── DRAWER ───────────────────────────────────────────────────────────────────
function openDrawer(title,renderFn){
  document.getElementById('drawer-title').textContent=title;
  const el=document.getElementById('drawer-content');
  el.innerHTML='';
  renderFn(el);
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  if(window._smsState?.timer){clearInterval(window._smsState.timer);window._smsState.timer=null;}
}

// ─── SCREEN SWITCH ────────────────────────────────────────────────────────────
let _curScreen='dashboard';
function showScreen(id,btn){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  _curScreen=id;
  document.getElementById('topbar-title').textContent=id.toUpperCase();
  if(!PANELS[id]){PANELS[id]=true;renderScreen(id);}
}
function openPanel(id,label){
  const map={
    health:renderHealth,sms:renderSMSAlerts,
    orders:renderOrders,products:renderProducts,
    health_detail:renderHealthDetail,logs:renderLogs,
    sync:renderSync,
  };
  if(map[id]) openDrawer(label,map[id]);
  else openDrawer(label,el=>{el.innerHTML=`<div class="empty">🔧 ${label}<br><br><a href="https://shop.downrangeco.com/admin" target="_blank" style="color:var(--gold);font-size:11px">Open Admin →</a></div>`;});
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
function initApp(){
  renderScreen('dashboard');
  api('/api/ops/health').then(d=>{
    const el=document.getElementById('topbar-status');
    if(el) el.style.color=d.status==='ok'||d.status==='healthy'?'var(--ok)':'var(--err)';
  }).catch(()=>{});
}
function renderScreen(id){
  const el=document.getElementById('screen-'+id);
  if(!el)return;
  if(id==='dashboard') renderDashboard(el);
  if(id==='ops')       renderOpsScreen(el);
  if(id==='orders')    renderOrders(el);
  if(id==='settings')  renderSettings(el);
}

// ══════════════════════════════════════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════════════════════════════════════
async function renderDashboard(el){
  el.innerHTML='<div class="loading"><span class="spinner">◈</span> Loading...</div>';
  try{
    const [h,l]=await Promise.all([
      api('/api/ops/health').catch(()=>({})),
      api('/api/ops/alert?count=50').catch(()=>({logs:[],stats:{}})),
    ]);
    const logs=l.logs||[];
    const stats=l.stats||{};
    const smsLogs=logs.filter(x=>x.job==='sms'||x.job==='sms-test');
    const smsSent=smsLogs.filter(x=>x.level==='ok').length;
    el.innerHTML=`
    <div class="section-title">DOWN RANGE <span style="color:var(--gold)">SHOP</span></div>
    <div class="section-sub">store operations · ${new Date().toLocaleDateString()}</div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-val" style="color:${h.status==='ok'||h.status==='healthy'?'var(--ok)':'var(--err)'}">${h.status?.toUpperCase()||'—'}</div><div class="stat-lbl">Site Status</div></div>
      <div class="stat-box"><div class="stat-val">${stats.total||0}</div><div class="stat-lbl">Log Events</div></div>
      <div class="stat-box"><div class="stat-val" style="color:${stats.errors?'var(--err)':'var(--ok)'}">${stats.errors||0}</div><div class="stat-lbl">Errors</div></div>
      <div class="stat-box"><div class="stat-val" style="color:var(--ok)">${smsSent}</div><div class="stat-lbl">SMS Sent</div></div>
    </div>
    <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px">Quick Access</div>
    <div class="panel-grid">
      <button class="panel-btn" onclick="openPanel('sms','SMS Alerts')">
        <span class="panel-icon">📱</span>
        <span class="panel-label">SMS Alerts</span>
        <span class="panel-sub">Twilio log · sent/skipped/failed</span>
        <span class="panel-badge">new</span>
      </button>
      <button class="panel-btn" onclick="openPanel('health','System Health')">
        <span class="panel-icon">◎</span>
        <span class="panel-label">Health</span>
        <span class="panel-sub">API checks · uptime</span>
      </button>
      <button class="panel-btn" onclick="openPanel('logs','Ops Log')">
        <span class="panel-icon">📋</span>
        <span class="panel-label">Ops Log</span>
        <span class="panel-sub">${logs.length} events</span>
      </button>
      <button class="panel-btn" onclick="openPanel('sync','Sync Products')">
        <span class="panel-icon">⟳</span>
        <span class="panel-label">Sync</span>
        <span class="panel-sub">Shopify/Printify cache</span>
      </button>
    </div>
    ${h.checks?`
    <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin:16px 0 8px">System Checks</div>
    ${h.checks.map(c=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg2);border:1px solid var(--border);margin-bottom:4px">
      <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700">${c.name}</span>
      <span class="pill ${c.status==='ok'||c.status==='healthy'?'pill-ok':c.status==='warn'?'pill-warn':'pill-err'}">${c.status?.toUpperCase()}</span>
    </div>`).join('')}`:''}`
  }catch(e){el.innerHTML=`<div class="empty">Error: ${e.message}</div>`;}
}

// ══════════════════════════════════════════════════════════════════════════════
// OPS SCREEN
// ══════════════════════════════════════════════════════════════════════════════
function renderOpsScreen(el){
  el.innerHTML=`
  <div class="section-title">OPERATIONS</div>
  <div class="section-sub">health, alerts & SMS management</div>
  <div class="panel-grid">
    <button class="panel-btn" onclick="openPanel('sms','SMS Alerts')">
      <span class="panel-icon">📱</span>
      <span class="panel-label">SMS Alerts</span>
      <span class="panel-sub">Execution log · test · config</span>
      <span class="panel-badge">new</span>
    </button>
    <button class="panel-btn" onclick="openPanel('health','System Health')">
      <span class="panel-icon">◎</span>
      <span class="panel-label">Health</span>
      <span class="panel-sub">API uptime checks</span>
    </button>
    <button class="panel-btn" onclick="openPanel('logs','Ops Log')">
      <span class="panel-icon">📋</span>
      <span class="panel-label">Full Log</span>
      <span class="panel-sub">All events · filter by job</span>
    </button>
    <button class="panel-btn" onclick="openPanel('sync','Sync Products')">
      <span class="panel-icon">⟳</span>
      <span class="panel-label">Sync Products</span>
      <span class="panel-sub">Revalidate ISR cache</span>
    </button>
  </div>
  <div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;margin:16px 0 8px">Cron Schedule</div>
  ${[['Product Sync','Hourly','/api/ops/sync-products'],['Health Check','Every 15m','/api/ops/health?alert=1']].map(([j,s,p])=>`
  <div style="background:var(--bg2);border:1px solid var(--border);padding:10px 12px;margin-bottom:6px">
    <div style="font-family:'Bebas Neue',cursive;font-size:15px;letter-spacing:.06em">${j}</div>
    <div style="display:flex;gap:12px;margin-top:4px">
      <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--gold)">${s}</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:#8888dd">${p}</span>
    </div>
  </div>`).join('')}`;
}

// ══════════════════════════════════════════════════════════════════════════════
// SMS ALERTS PANEL — full execution log
// ══════════════════════════════════════════════════════════════════════════════
window._smsState={tab:'all',search:'',expanded:null,autoRefresh:true,timer:null,data:null};

async function renderSMSAlerts(el){
  if(window._smsState.timer){clearInterval(window._smsState.timer);window._smsState.timer=null;}
  await _smsLoad(el);
  if(window._smsState.autoRefresh){
    window._smsState.timer=setInterval(()=>_smsLoad(el,true),15000);
  }
}
async function _smsLoad(el,silent=false){
  if(!silent) el.innerHTML='<div class="loading"><span class="spinner">◈</span> Loading SMS log...</div>';
  try{
    // Shop uses /api/ops/alert for the log (OpsLog format, filtered by job=sms)
    const [l,testCfg]=await Promise.all([
      api('/api/ops/alert?count=200').catch(()=>({logs:[]})),
      fetch('/api/ops/test-sms').then(r=>r.text()).catch(()=>''),
    ]);
    // Extract SMS-specific logs
    const allLogs=l.logs||[];
    window._smsState.data={log:allLogs.filter(x=>x.job==='sms'||x.job==='sms-test'),allLogs};
    _smsRender(el);
  }catch(e){if(!silent) el.innerHTML=`<div class="empty">Error: ${e.message}</div>`;}
}

function _smsClassify(l){
  if(l.level==='ok') return 'sent';
  const t=(l.detail||'')+(l.message||'');
  if(/cooldown|Cooldown|not configured|skipped|Missing|quiet/i.test(t)) return 'skipped';
  return 'failed';
}
function _smsBadge(l){
  const c=_smsClassify(l);
  if(c==='sent')    return '<span class="pill pill-ok">✓ SENT</span>';
  if(c==='skipped') return '<span class="pill" style="background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.25)">SKIPPED</span>';
  return '<span class="pill pill-err">✕ FAILED</span>';
}

function _smsRender(el){
  const d=window._smsState.data;
  if(!d){el.innerHTML='<div class="empty">No data</div>';return;}
  const log=d.log||[];
  const sent=log.filter(l=>_smsClassify(l)==='sent');
  const failed=log.filter(l=>_smsClassify(l)==='failed');
  const skipped=log.filter(l=>_smsClassify(l)==='skipped');
  const rate=log.length?Math.round((sent.length/log.length)*100):null;
  const lastSent=sent[0];
  const tab=window._smsState.tab;
  const search=(window._smsState.search||'').toLowerCase();

  const filtered=log.filter(l=>{
    if(tab==='sent'    && _smsClassify(l)!=='sent')    return false;
    if(tab==='failed'  && _smsClassify(l)!=='failed')  return false;
    if(tab==='skipped' && _smsClassify(l)!=='skipped') return false;
    if(search && !((l.message||'').toLowerCase().includes(search)||(l.job||'').toLowerCase().includes(search)||(l.detail||'').toLowerCase().includes(search))) return false;
    return true;
  });

  const sparkBars=log.slice(0,16).reverse().map(l=>{
    const c=_smsClassify(l);
    const h=c==='sent'?18:c==='skipped'?10:6;
    const bg=c==='sent'?'var(--ok)':c==='skipped'?'#60a5fa':'var(--err)';
    return `<div style="width:5px;height:${h}px;background:${bg};border-radius:1px;flex-shrink:0"></div>`;
  }).join('');

  const rows=filtered.slice(0,80).map(l=>{
    const isExp=window._smsState.expanded===l.id;
    const c=_smsClassify(l);
    // For shop, SID is in l.meta?.twilio_sid or parsed from l.detail
    const sid=l.meta?.twilio_sid||(l.detail?.match(/SID: (SM\w+)/)||[])[1]||null;
    const errCode=l.meta?.twilio_code||(l.detail?.match(/Code (\d+)/)||[])[1]||null;
    const latency=l.duration;
    const detail=isExp?`<div style="background:#060a0f;border-bottom:1px solid var(--border);padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:10px;line-height:1.9">
      ${[
        ['Time',     fmtTime(l.ts)],
        ['Level',    l.level],
        ['Job',      l.job],
        ['Message',  l.message||'—'],
        l.detail?['Detail',l.detail]:null,
        sid?['Twilio SID',sid]:null,
        l.meta?.twilio_status?['Status',l.meta.twilio_status]:null,
        l.meta?.http_status?['HTTP',String(l.meta.http_status)]:null,
        errCode?['Error Code',errCode+(errCode==30034?' — Toll-free verify':errCode==21608?' — Number unverified':'')]:null,
        l.meta?.from_number?['From',l.meta.from_number]:null,
        l.meta?.to_number?['To',l.meta.to_number]:null,
        latency?['Latency',latency+'ms']:null,
        ['ID',(l.id||'—').slice(0,20)],
      ].filter(Boolean).map(([k,v])=>`<div style="display:grid;grid-template-columns:90px 1fr;gap:4px 8px;margin-bottom:2px">
          <span style="color:var(--dim);font-size:9px;text-transform:uppercase;letter-spacing:.06em">${k}</span>
          <span style="color:${k==='Message'||k==='Detail'?'var(--text)':k==='Twilio SID'||k==='Status'?'var(--ok)':k.includes('Error')||k==='HTTP'&&parseInt(v)>=400?'var(--err)':'var(--dim)'};word-break:break-all">${v}</span>
        </div>`).join('')}
    </div>`:''
    return `<div onclick="_shopSmsToggle('${l.id}',this.closest('[data-sms-log]'))" style="border-bottom:1px solid var(--border);background:${isExp?'#0d0d0f':'transparent'};cursor:pointer">
      <div style="display:grid;grid-template-columns:75px 70px 1fr 45px;gap:0;padding:8px 12px;align-items:center">
        <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim)">${fmtAge(l.ts)}</div>
        ${_smsBadge(l)}
        <div style="font-size:11px;color:${c==='sent'?'var(--text)':c==='skipped'?'#60a5fa':'var(--err)'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 8px">
          ${l.job?`<span style="color:var(--gold);margin-right:4px">${l.job}</span>`:''}${c==='sent'?l.message:(l.detail||l.message||'—')}
        </div>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);text-align:right">${latency?latency+'ms':'—'} ${isExp?'▲':'▼'}</div>
      </div>
      ${detail}
    </div>`;
  }).join('');

  el.innerHTML=`
  <!-- Status -->
  <div style="background:var(--bg2);border:1px solid var(--border);padding:12px;margin-bottom:12px;display:flex;align-items:center;gap:12px">
    <span style="font-size:20px">${log.length?'🟢':'🔴'}</span>
    <div style="flex:1">
      <div style="font-family:'Bebas Neue',cursive;font-size:16px;letter-spacing:.06em;color:var(--gold)">DownRange-Shop</div>
      <div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);margin-top:2px">+12062036281 → +12066016076${lastSent?' · last '+fmtAge(lastSent.ts):''}</div>
    </div>
    <div style="display:flex;gap:2px;align-items:flex-end;height:20px">${sparkBars}</div>
  </div>

  <!-- Stats -->
  <div class="stat-grid" style="grid-template-columns:repeat(5,1fr);margin-bottom:12px">
    ${[['Events',log.length,'var(--text)'],['Sent',sent.length,'var(--ok)'],['Failed',failed.length,failed.length?'var(--err)':'var(--dim)'],['Skipped',skipped.length,'#60a5fa'],['Rate',rate!=null?rate+'%':'—',rate>=90?'var(--ok)':rate>=50?'var(--warn)':'var(--err)']].map(([l,v,c])=>`
    <div class="stat-box" style="text-align:center;padding:6px 4px">
      <div class="stat-val" style="color:${c};font-size:1.3rem">${v}</div>
      <div class="stat-lbl" style="font-size:7px">${l}</div>
    </div>`).join('')}
  </div>

  <!-- Actions -->
  <div style="display:flex;gap:8px;margin-bottom:10px">
    <button class="btn" style="flex:1;background:rgba(34,197,94,.12);color:var(--ok);border:1px solid rgba(34,197,94,.25)" onclick="_shopSmsSendTest(this)">📱 Send Test SMS</button>
    <a href="/api/ops/test-sms" target="_blank" class="btn-outline" style="display:flex;align-items:center;justify-content:center;flex:1">🔍 Diagnostic</a>
  </div>
  <div id="shop-sms-test-result" style="margin-bottom:10px"></div>

  <!-- Filter tabs -->
  <div style="display:flex;border-bottom:1px solid var(--border);margin-bottom:0">
    ${[['all','All',log.length],['sent','Sent',sent.length],['failed','Failed',failed.length],['skipped','Skip',skipped.length]].map(([id,lbl,n])=>`
    <button onclick="_shopSmsSetTab('${id}',this.closest('#drawer-content'))" style="flex:1;background:none;border:none;border-bottom:2px solid ${tab===id?'var(--gold)':'transparent'};color:${tab===id?'var(--gold)':'var(--dim)'};font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;padding:8px 4px;cursor:pointer">
      ${lbl} <span style="font-size:9px;opacity:.7">${n}</span>
    </button>`).join('')}
  </div>
  <div style="padding:8px 0 8px">
    <input oninput="_shopSmsSetSearch(this.value,this.closest('#drawer-content'))" value="${search}"
      placeholder="filter by job or message…"
      style="width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:7px 10px;outline:none">
  </div>

  <!-- Log table -->
  <div data-sms-log style="border:1px solid var(--border);background:#050809">
    <div style="display:grid;grid-template-columns:75px 70px 1fr 45px;padding:5px 12px;border-bottom:1px solid var(--border)">
      ${['Time','Status','Job / Message','ms'].map(h=>`<div style="font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em">${h}</div>`).join('')}
    </div>
    <div style="max-height:380px;overflow-y:auto;-webkit-overflow-scrolling:touch">
      ${filtered.length===0
        ?`<div class="empty">${log.length===0?'No SMS events yet. Send a test above.':`No ${tab} events${search?' matching "'+search+'"':''}.`}</div>`
        :rows}
    </div>
  </div>

  <div style="margin-top:10px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim2);border-top:1px solid var(--border);padding-top:8px;display:flex;justify-content:space-between;align-items:center">
    <span>Twilio · opsLogger · DownRange-Shop</span>
    <label style="display:flex;gap:5px;align-items:center;cursor:pointer">
      <input type="checkbox" ${window._smsState.autoRefresh?'checked':''} onchange="_shopSmsToggleRefresh(this.checked,this.closest('#drawer-content'))" style="accent-color:var(--gold)">
      <span>auto 15s</span>
    </label>
  </div>`;
}

function _shopSmsToggle(id,logEl){
  window._smsState.expanded=window._smsState.expanded===id?null:id;
  if(logEl)_smsRender(logEl.closest('#drawer-content'));
}
function _shopSmsSetTab(tab,el){window._smsState.tab=tab;window._smsState.expanded=null;_smsRender(el);}
function _shopSmsSetSearch(val,el){window._smsState.search=val;window._smsState.expanded=null;_smsRender(el);}
function _shopSmsToggleRefresh(on,el){
  window._smsState.autoRefresh=on;
  if(window._smsState.timer){clearInterval(window._smsState.timer);window._smsState.timer=null;}
  if(on&&el)window._smsState.timer=setInterval(()=>_smsLoad(el,true),15000);
}
async function _shopSmsSendTest(btn){
  btn.disabled=true;btn.textContent='Sending…';
  const res=document.getElementById('shop-sms-test-result');
  try{
    const d=await apiPost('/api/ops/test-sms',{});
    if(d.sent){
      res.innerHTML=`<div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);padding:8px 12px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ok)">✓ Sent · SID: ${d.twilio_sid||'—'} · ${d.twilio_status||''} · delivered</div>`;
    }else{
      res.innerHTML=`<div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);padding:8px 12px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--err)">✕ Failed · Code: ${d.twilio_code||'—'} · ${d.twilio_error||'unknown'}</div>`;
    }
    setTimeout(()=>_smsLoad(btn.closest('#drawer-content'),true),1200);
  }catch(e){
    res.innerHTML=`<div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);padding:8px 12px;font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--err)">✕ ${e.message}</div>`;
  }
  btn.disabled=false;btn.textContent='📱 Send Test SMS';
}

// ══════════════════════════════════════════════════════════════════════════════
// HEALTH PANEL
// ══════════════════════════════════════════════════════════════════════════════
async function renderHealth(el){
  el.innerHTML='<div class="loading"><span class="spinner">◈</span></div>';
  try{
    const h=await api('/api/ops/health');
    el.innerHTML=`<div style="font-family:'Bebas Neue',cursive;font-size:1.8rem;letter-spacing:.06em;color:${h.status==='ok'||h.status==='healthy'?'var(--ok)':'var(--err)'};margin-bottom:12px">${h.status?.toUpperCase()}</div>`+
    (h.checks||[]).map(c=>`<div style="background:var(--bg2);border:1px solid ${c.status==='ok'||c.status==='healthy'?'rgba(34,197,94,.2)':'rgba(239,68,68,.2)'};padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between">
      <div><div style="font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700">${c.name}</div>${c.detail?`<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);margin-top:3px">${c.detail}</div>`:''}</div>
      <div style="text-align:right"><span class="pill ${c.status==='ok'||c.status==='healthy'?'pill-ok':'pill-err'}">${c.status?.toUpperCase()}</span>${c.latency?`<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);margin-top:3px">${c.latency}ms</div>`:''}</div>
    </div>`).join('');
  }catch(e){el.innerHTML=`<div class="empty">Error: ${e.message}</div>`;}
}

// ══════════════════════════════════════════════════════════════════════════════
// OPS LOG PANEL
// ══════════════════════════════════════════════════════════════════════════════
async function renderLogs(el){
  el.innerHTML='<div class="loading"><span class="spinner">◈</span></div>';
  try{
    const l=await api('/api/ops/alert?count=200');
    const logs=l.logs||[];
    const lc=(lv)=>({ok:'var(--ok)',info:'#8888dd',warn:'var(--warn)',error:'var(--err)',critical:'#ff5555'}[lv]||'var(--dim)');
    const li=(lv)=>({ok:'✓',info:'·',warn:'△',error:'✗',critical:'!'}[lv]||'·');
    el.innerHTML=`<div style="font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);margin-bottom:10px">${logs.length} events</div>`+
    `<button class="btn-danger" style="width:100%;margin-bottom:12px" onclick="clearOpsLog(this.closest('#drawer-content'))">✕ Clear All Logs</button>`+
    logs.slice(0,100).map(l=>`<div style="background:var(--bg2);border:1px solid var(--border);padding:8px 12px;margin-bottom:4px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;color:${lc(l.level)}">${li(l.level)}</span>
        <span style="font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--gold)">${l.job}</span>
        <span style="font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--dim);margin-left:auto">${fmtAge(l.ts)}</span>
      </div>
      <div style="font-size:11px;color:var(--text)">${l.message}</div>
      ${l.detail?`<div style="font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--dim);margin-top:3px;word-break:break-all">${l.detail}</div>`:''}
    </div>`).join('');
  }catch(e){el.innerHTML=`<div class="empty">Error: ${e.message}</div>`;}
}
async function clearOpsLog(el){
  if(!confirm('Clear all ops logs?')) return;
  await fetch('/api/ops/alert',{method:'DELETE',headers:{'x-admin-key':_key}});
  renderLogs(el);
}

// ══════════════════════════════════════════════════════════════════════════════
// SYNC PRODUCTS
// ══════════════════════════════════════════════════════════════════════════════
async function renderSync(el){
  el.innerHTML=`<div class="section-title">Sync Products</div><div class="section-sub">Revalidates Next.js ISR cache from Shopify/Printify</div>
  <button class="btn" onclick="doSync(this,this.closest('#drawer-content'))">⟳ Sync Now</button>
  <div id="sync-result" style="margin-top:12px"></div>`;
}
async function doSync(btn,el){
  btn.disabled=true;btn.textContent='Syncing…';
  try{
    await fetch('/api/ops/sync-products',{headers:{'x-admin-key':_key}});
    document.getElementById('sync-result').innerHTML='<div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.25);padding:10px 12px;font-family:\'IBM Plex Mono\',monospace;font-size:11px;color:var(--ok)">✓ Sync complete</div>';
    flash('Product sync complete');
  }catch(e){
    document.getElementById('sync-result').innerHTML=`<div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--err)">✕ ${e.message}</div>`;
  }
  btn.disabled=false;btn.textContent='⟳ Sync Now';
}

  <a href="https://admin.shopify.com" target="_blank" class="btn" style="display:block;text-align:center;text-decoration:none;margin-bottom:12px">Open Shopify Admin →</a>

// SETTINGS

function renderSettings(el){
  el.innerHTML=`<div class="section-title">SETTINGS</div><div class="section-sub">Admin session & links</div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <a href="https://shop.downrangeco.com/admin" target="_blank" class="btn" style="display:block;text-align:center;text-decoration:none">Open Web Admin →</a>
    <a href="/api/ops/test-sms" target="_blank" class="btn-outline" style="display:flex;align-items:center;justify-content:center;padding:11px">🔍 SMS Diagnostic Page</a>
    <a href="https://vercel.com/dashboard" target="_blank" class="btn-outline" style="display:flex;align-items:center;justify-content:center;padding:11px">▲ Vercel Dashboard</a>

  </div>`;
}
